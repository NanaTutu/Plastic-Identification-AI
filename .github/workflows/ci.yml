name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plasticid
    env:
      API_KEY: test_api_key
      MYSQL_PASSWORD: test_password
      RATE_LIMIT_REDIS_REQUIRED: "0"
      DB_STARTUP_REQUIRED: "0"
      DB_STARTUP_ATTEMPTS: "1"
      DB_STARTUP_DELAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plasticid/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q api src
      - run: python -m pytest

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plasticid-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
