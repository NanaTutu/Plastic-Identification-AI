services:
  fastapi:
    build: ./plasticid
    container_name: plasticid-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./plasticid/data:/app/data
      - ./plasticid/models:/app/models
    depends_on:
      - ci
    networks:
      - plasticid-net

  ci:
    build: ./plasticid-backend
    container_name: plasticid-backend
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      CI_ENVIRONMENT: development
      database.default.hostname: plasticid-db
      database.default.database: ${MYSQL_DATABASE}
      database.default.username: ${MYSQL_USER}
      database.default.password: ${MYSQL_PASSWORD}
      database.default.DBDriver: MySQLi
    networks:
      - plasticid-net

  plasticid-db:
    image: mysql:8.0
    container_name: plasticid-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - plasticid-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - plasticid-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - plasticid-net

networks:
  plasticid-net:

volumes:
  mysql_data:
