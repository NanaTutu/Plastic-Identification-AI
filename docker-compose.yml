services:
  fastapi:
    build:
      context: ./plasticid
    container_name: plasticid-fastapi
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      PORTAL_API_KEY: ${PORTAL_API_KEY:-}
      CI_API_KEY: ${CI_API_KEY:-}
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      DB_HOST: plasticid-db
      DB_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plasticid_db}
      MYSQL_USER: plasticid_api
      MYSQL_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      RATE_LIMIT_REDIS_REQUIRED: ${RATE_LIMIT_REDIS_REQUIRED:-1}
      DB_STARTUP_REQUIRED: ${DB_STARTUP_REQUIRED:-1}
      DB_STARTUP_ATTEMPTS: ${DB_STARTUP_ATTEMPTS:-10}
      DB_STARTUP_DELAY: ${DB_STARTUP_DELAY:-2}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-1}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-5}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_CLAIM_TIMEOUT_SECONDS: ${OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
      INFERENCE_LOCK_TIMEOUT: ${INFERENCE_LOCK_TIMEOUT:-30}
      READ_RATE_LIMIT: ${READ_RATE_LIMIT:-120}
      READ_RATE_WINDOW: ${READ_RATE_WINDOW:-60}
      RATE_LIMIT_MEMORY_MAX_KEYS: ${RATE_LIMIT_MEMORY_MAX_KEYS:-10000}
      MODEL_PATH: ${MODEL_PATH:-/app/models/best_v8m.pt}
      DETECTOR_PATH: ${DETECTOR_PATH:-/app/yolov8n.pt}
      CI_ENDPOINT: ${CI_ENDPOINT:-http://ci/api/predictions}
      PORTAL_RATE_LIMIT: ${PORTAL_RATE_LIMIT:-100}
      PORTAL_RATE_WINDOW: ${PORTAL_RATE_WINDOW:-60}
      CACHE_MAX_IMAGE_SIZE: ${CACHE_MAX_IMAGE_SIZE:-2097152}
      MAX_IMAGE_EDGE: ${MAX_IMAGE_EDGE:-1280}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
    volumes:
      - ./plasticid/data:/app/data:ro
      - ./plasticid/models:/app/models
      - ./yolov8n.pt:/app/yolov8n.pt:ro
    depends_on:
      plasticid-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ci:
        condition: service_healthy
    networks:
      - plasticid-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 90s

  ci:
    build: ./plasticid-backend
    container_name: plasticid-backend
    restart: unless-stopped
    init: true
    ports:
      - "8080:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      DB_HOST: plasticid-db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: plasticid_ci
      DB_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD must be set in .env}
      MIGRATE_DB_USER: plasticid_migrate
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD must be set in .env}
      DB_DEBUG: ${DB_DEBUG:-0}
      PLASTICID_API_KEY: ${API_KEY:?API_KEY must be set in .env}
      PLASTICID_PORTAL_API_KEY: ${PORTAL_API_KEY:-}
      PORTAL_REQUESTS_PER_MINUTE: ${PORTAL_REQUESTS_PER_MINUTE:-20}
      FASTAPI_BASE_URL: http://plasticid-fastapi:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      plasticid-db:
        condition: service_healthy
    networks:
      - plasticid-net
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost/
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  plasticid-db:
    image: mysql:8.0
    container_name: plasticid-db
    restart: always
    # Needed by the retention events created in the production migration.
    command: ["--event-scheduler=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plasticid_db}
      # Consumed by mysql/bootstrap.sh on the first boot of an empty volume.
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD must be set in .env}
      CI_DB_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD must be set in .env}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro
    expose:
      - "3306"
    networks:
      - plasticid-net
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: plasticid-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - plasticid-net
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - plasticid-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - plasticid-net

networks:
  plasticid-net:

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
